<style>
/* Layout: barra fixa com seleção da unidade e busca; abaixo, cartão do endereço do campus e lista de setores com telefone em destaque. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#18231c; --muted:#5b6a60; --line:#d9dfd7;
  --accent:#1f7a3a; --accent-ink:#ffffff; --accent-soft:#e1f1e5; --signal:#b3261e; --signal-soft:#f9e3e1; --warn:#8a5a00; --warn-soft:#fbefd2;
  --f-display:'Schibsted Grotesk',system-ui,'Segoe UI',sans-serif; --f-body:'Schibsted Grotesk',system-ui,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211b; --ink:#e8efe9; --muted:#9bab9f; --line:#2b372e;
  --accent:#58c27a; --accent-ink:#0c1a11; --accent-soft:#1d3426; --signal:#ff8a80; --signal-soft:#3a1f1d; --warn:#f0c15c; --warn-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --ink:#e8efe9; --muted:#9bab9f; --line:#2b372e;
  --accent:#58c27a; --accent-ink:#0c1a11; --accent-soft:#1d3426; --signal:#ff8a80; --signal-soft:#3a1f1d; --warn:#f0c15c; --warn-soft:#3a2f12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand h1 small{display:block;font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.logo{width:40px;height:40px;flex:none}
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
@media(max-width:560px){.controls{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;font-weight:500;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding-block:18px;display:flex;flex-direction:column;gap:14px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.unit h2{margin:0;font-family:var(--f-display);font-size:1.15rem;text-wrap:balance}
.unit .kind{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.sig{background:var(--signal-soft);color:var(--signal)}
.count{font-size:.9rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start}
@media(max-width:560px){.sec{grid-template-columns:minmax(0,1fr)}}
.sec h3,.sn{text-transform:uppercase}
.sec h3{margin:0;font-size:1.05rem;font-weight:700;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sub{font-size:.85rem;color:var(--muted);margin-top:4px}
.phone{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
@media(max-width:560px){.phone{align-items:flex-start}}
.phone .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.25rem;color:var(--accent);overflow-wrap:anywhere}
.phone .none{font-size:.9rem;color:var(--muted);font-style:italic}
.phone .mail{font-family:var(--f-mono);font-size:.85rem;color:var(--accent);overflow-wrap:anywhere;text-decoration:none}
.phone .mail:hover{text-decoration:underline}
.phone .cel{font-family:var(--f-mono);font-size:.9rem;color:var(--ink)}
.cp{font:inherit;font-size:.78rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer}
.cp:hover{color:var(--ink);border-color:var(--muted)}
.resp{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px;font-size:.92rem}
.resp .p{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.resp .nm{font-weight:600} .resp .cg{color:var(--muted)}
.resp .rm{font-family:var(--f-mono);font-size:.82rem;color:var(--accent)}
.resp .rdt{font-size:.72rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.nores{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
.obs{margin:0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
footer{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-top:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.live{background:var(--accent)} .dot.snap{background:var(--warn)}
.tbtn{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
</style>

</main></div>

  const g=(r,n)=>((r[ix(n)]||"")+"").trim();
  const units=u.slice(1).filter(r=>g(r,"SIGLA")).map(r=>({sig:g(r,"SIGLA"),nome:g(r,"UNIDADE"),tipo:g(r,"TIPO"),cidade:g(r,"CIDADE"),end:g(r,"ENDEREÇO"),tel:g(r,"TELEFONE GERAL"),mail:g(r,"E-MAIL GERAL"),site:g(r,"SITE"),sit:g(r,"SITUAÇÃO"),obs:g(r,"FONTE / OBSERVAÇÃO"),aba:g(r,"ABA")}));
  const sectors=[],missing=[];
  for(const un of units){
    if(un.sig==="RTR"){const rows=await getRows(RTR_TAB);if(!rows){missing.push(RTR_TAB);DB.sectors.filter(s=>s.u==="RTR").forEach(s=>sectors.push(s));continue}buildRtr(rows,DB.rtrUnits).forEach(s=>sectors.push(s));continue}
    const rows=await getRows(un.aba||un.sig);
    if(!rows){missing.push(un.aba||un.sig);DB.sectors.filter(s=>s.u===un.sig).forEach(s=>sectors.push(s));continue}
    const hh=rows[0].map(x=>(x||"").toString().trim().toUpperCase());const c=n=>hh.indexOf(n);const v=(r,n)=>((r[c(n)]||"")+"").trim();
    rows.slice(1).forEach(r=>{if(!v(r,"SETOR"))return;const nm=v(r,"RESPONSÁVEL (NOME)");
      sectors.push({u:un.sig,setor:v(r,"SETOR"),sigla:v(r,"SIGLA DO SETOR"),nat:v(r,"NATUREZA"),tel:v(r,"TELEFONE FIXO / RAMAL"),cel:v(r,"CELULAR INSTITUCIONAL"),mail:v(r,"E-MAIL"),obs:v(r,"OBSERVAÇÕES"),resp:nm?[{nome:nm,cargo:v(r,"CARGO / FUNÇÃO"),ramal:"",rdt:""}]:[]})});
  }
  return {units,sectors,missing};
}

async function csvRows(tab){try{const r=await fetch("https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(tab),{cache:"no-store"});if(!r.ok)return null;const t=await r.text();if(/^\s*</.test(t))return null;return parseCSV(t)}catch(_){return null}}
let liveAt=null,cacheAt=null;
async function refresh(){
  const b=$("reload");if(b)b.disabled=true;
  try{const r=await assemble(csvRows);DB={...DB,units:r.units,sectors:r.sectors};liveAt=new Date();
    try{localStorage.setItem("ifmt-cache",JSON.stringify({units:r.units,sectors:r.sectors,when:liveAt.toISOString()}))}catch(_){}
  }catch(e){}
  paint();if(b)b.disabled=false;
}
try{const c=JSON.parse(localStorage.getItem("ifmt-cache")||"null");if(c&&c.units&&c.sectors){DB={...DB,units:c.units,sectors:c.sectors};cacheAt=new Date(c.when)}}catch(_){}
const HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
function composeDoc(newDB){
  const j=s=>JSON.stringify(s).replace(/<\//g,"<\\/");
  const body=TPL.split(PH_D).join(j(newDB)).split(PH_T).join(j(TPL));
  return HEAD+body+"\n</body></html>";
}
let ART=null,pending=null;
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function setMsg(html){$("admMsg").innerHTML=html}
async function onFile(e){
  const f=e.target.files[0];pending=null;$("admGo").hidden=true;if(!f)return;
  setMsg("Lendo o arquivo...");
  try{
    if(typeof XLSX==="undefined")throw new Error("Não foi possível carregar o leitor de planilhas. Verifique a conexão e tente de novo.");
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const getRows=async n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""}):null;
    const r=await assemble(getRows);
    pending=r;
    setMsg("Encontrei <strong>"+r.units.length+" unidades</strong> e <strong>"+r.sectors.length+" setores</strong>."+(r.missing.length?' <span class="pill warn">Abas não encontradas (mantidos os dados anteriores): '+esc(r.missing.join(", "))+"</span>":""));
    $("admGo").hidden=false;
  }catch(err){setMsg('<span class="pill sig">'+esc(err.message||"Não consegui ler o arquivo.")+"</span>")}
}
async function publish(){
  if(!pending||!ART)return;
  $("admGo").disabled=true;setMsg("Publicando...");
  try{
    const nd={units:pending.units,sectors:pending.sectors,rtrUnits:DB.rtrUnits,snap:todayISO()};
    await ART.publish(composeDoc(nd));
    setMsg("Atualizado. A página vai recarregar com os dados novos.");
  }catch(err){
    const c=err&&err.code;
    setMsg('<span class="pill sig">'+(c==="conflict"?"Outra atualização foi publicada ao mesmo tempo. Recarregue a página e tente de novo.":(c==="not_granted"||c==="not_writer")?"Somente quem pode editar este app consegue publicar a atualização.":"Não consegui publicar: "+esc((err&&err.message)||"erro desconhecido"))+"</span>");
    $("admGo").disabled=false;
  }
}
function fmtWhen(){
  const D=x=>x.toLocaleDateString("pt-BR");
  if(liveAt)return "Planilha lida em "+D(liveAt)+" às "+liveAt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(cacheAt)return "Última atualização em "+D(cacheAt);
  const [y,m,d]=DB.snap.split("-");return "Última atualização em "+d+"/"+m+"/"+y;
}
function unitOptions(){
  const sel=$("unit");const keep=state.unit;
  const g=(label,list)=>list.length?'<optgroup label="'+label+'">'+list.map(u=>'<option value="'+esc(u.sig)+'">'+esc(u.nome)+(u.sig!=="RTR"?" ("+esc(u.sig)+")":"")+"</option>").join("")+"</optgroup>":"";
  const rtr=DB.units.filter(u=>u.tipo==="Reitoria");
  const campi=DB.units.filter(u=>u.tipo!=="Reitoria").sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
  sel.innerHTML=g("Reitoria",rtr)+g("Campi",campi);
  sel.value=keep;
}
function chipsFor(list){
  const set=[...new Set(list.map(s=>s.nat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt"));
  if(state.nat&&!set.includes(state.nat))state.nat="";
  $("chips").innerHTML=['<button type="button" class="chip" data-n="" aria-pressed="'+(state.nat===""?"true":"false")+'">Todos</button>'].concat(set.map(n=>'<button type="button" class="chip" data-n="'+esc(n)+'" aria-pressed="'+(state.nat===n?"true":"false")+'">'+esc(n)+"</button>")).join("");
}
const SIGLA_FIX={"diretoria de governança, integridade e gestão de riscos":"DGIGR"};
function sg(s){return s.sigla||SIGLA_FIX[(s.setor||"").toLowerCase()]||""}
function hay(s){return norm([fullTel(s.tel,DB.units.find(x=>x.sig===s.u)),s.setor,sg(s),s.nat,s.sub,s.subnome,s.andar,s.obs,s.tel,s.cel,s.mail,...(s.resp||[]).flatMap(r=>[r.nome,r.cargo,r.ramal])].join(" "))}
function copyBtn(txt){return '<button type="button" class="cp" data-copy="'+esc(txt)+'">Copiar</button>'}
function unitCard(u){
  const kv=[];
  kv.push(["Endereço",u.end?esc(u.end)+(u.cidade?" · "+esc(u.cidade):""):'<span class="pill warn">Endereço a preencher</span>'+(u.cidade?" "+esc(u.cidade):"")]);
  kv.push(["Telefone geral",u.tel?'<span class="mono">'+esc(u.tel)+"</span> "+copyBtn(u.tel):"Não informado"]);
  if(u.mail)kv.push(["E-mail",esc(u.mail)]);
  if(u.site)kv.push(["Site",'<a href="'+esc(u.site)+'" target="_blank" rel="noopener">'+esc(u.site.replace(/^https?:\/\//,""))+"</a>"]);
  if(u.obs&&/confirmar/i.test(u.obs))kv.push(["Atenção",'<span class="pill warn">Número a confirmar</span>']);
  return '<span class="kind">'+esc(u.tipo)+(u.sit?" · "+esc(u.sit):"")+'</span><h2>'+esc(u.nome)+'</h2><dl class="kv">'+kv.map(([k,v])=>"<dt>"+k+"</dt><dd>"+v+"</dd>").join("")+"</dl>";
}
function prefixOf(u){const d=(u&&u.tel||"").replace(/\D/g,"");const m=d.length>=10?d.slice(-10):"";return m.length===10&&m[2]!=="9"?"("+m.slice(0,2)+") "+m.slice(2,6)+"-":""}
function fullTel(tel,u){if(!tel)return"";const p=prefixOf(u);return tel.split(/\s*\/\s*/).map(x=>{const v=x.trim();return /^\d{4}$/.test(v)&&p?p+v:v}).join(" / ")}
function secCard(s,isRtr,u){
  const meta=[];
  if(sg(s))meta.push('<span class="pill sig">'+esc(sg(s))+"</span>");
  if(s.nat)meta.push('<span class="pill">'+esc(s.nat)+"</span>");
  if(isRtr&&s.andar)meta.push('<span class="pill warn">'+esc(s.andar)+"</span>");
  const ft=fullTel(s.tel,u);const phone=s.tel?'<span class="num">'+esc(ft)+"</span>"+copyBtn(ft):'<span class="none">Ramal não informado</span>';
  const mail=s.mail?'<a class="mail" href="mailto:'+esc(s.mail)+'">'+esc(s.mail)+"</a>":"";
  const cel=s.cel?'<span class="cel">Cel.: '+esc(s.cel)+"</span>":"";
  const resp=(s.resp||[]).length?'<div class="resp">'+s.resp.map(r=>'<div class="p"><span class="nm">'+esc(r.nome)+'</span><span class="cg">'+esc(r.cargo)+"</span>"+(r.ramal&&r.ramal!==s.tel?'<span class="rm">'+esc(fullTel(r.ramal,u))+"</span>":"")+(r.rdt&&r.rdt!=="PRESENCIAL"?'<span class="rdt">'+esc(r.rdt)+"</span>":"")+"</div>").join("")+"</div>":(isRtr?"":'<div class="resp"><span class="cg">Responsável: a preencher na planilha</span></div>');
  const sub=isRtr&&s.subnome?'<div class="sub sn">'+esc(s.subnome)+"</div>":(s.obs?'<div class="sub">'+esc(s.obs)+"</div>":"");
  return '<article class="sec"><div><h3>'+esc(s.setor)+'</h3><div class="meta">'+meta.join("")+"</div>"+sub+'</div><div class="phone">'+phone+mail+cel+"</div>"+resp+"</article>";
}
function paint(){
  unitOptions();
  const u=DB.units.find(x=>x.sig===state.unit)||DB.units[0];
  const all=DB.sectors.filter(s=>s.u===u.sig);
  chipsFor(all);
  const toks=norm(state.q).split(/\s+/).filter(Boolean);
  let list=all.filter(s=>(!state.nat||s.nat===state.nat)&&toks.every(t=>hay(s).includes(t)));
  $("unitCard").innerHTML=unitCard(u);
  const isRtr=u.sig==="RTR";
  $("count").textContent=list.length===all.length?(all.length+(all.length===1?" setor":" setores")):(list.length+" de "+all.length+" setores");
  $("list").innerHTML=list.length?list.map(s=>secCard(s,isRtr,u)).join(""):'<div class="nores">Nenhum setor encontrado nesta unidade. Tente outra palavra, a sigla ou a natureza (administrativo, ensino, gabinete).</div>';
  $("fresh").innerHTML=fmtWhen();
}
$("unit").addEventListener("change",e=>{state.unit=e.target.value;state.nat="";paint();try{localStorage.setItem("ifmt-unit",state.unit)}catch(_){}});
$("q").addEventListener("input",e=>{state.q=e.target.value;paint()});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;state.nat=b.dataset.n;paint()});
document.addEventListener("click",e=>{const b=e.target.closest(".cp");if(!b)return;const t=b.dataset.copy;
  const done=()=>{b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar",1400)};
  const fb=()=>{const r=document.createRange();const n=b.previousElementSibling||b;r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selecionado";setTimeout(()=>b.textContent="Copiar",1400)};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(_){fb()}});
try{const s=localStorage.getItem("ifmt-unit");if(s&&DB.units.some(u=>u.sig===s))state.unit=s}catch(_){}
paint();
$("reload").addEventListener("click",refresh);
refresh();setInterval(refresh,300000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
(async()=>{try{ART=await (window.claude&&window.claude.use?window.claude.use("artifact"):null)}catch(_){ART=null}
  })();
</script>
</body></html>
